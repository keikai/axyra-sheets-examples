<svg xmlns="http://www.w3.org/2000/svg" width="640" height="630" viewBox="0 0 640 630" role="img" aria-labelledby="title desc">
<title id="title">Write Excel: Java records to workbook</title><desc id="desc">Two Java records are imported into a worksheet with a bold header and calculated total.</desc>
<rect width="640" height="630" rx="16" fill="#f4f7fa"/>
<style>text{font-family:Arial,sans-serif;fill:#18364a}.label{font-size:18px;font-weight:bold}.mono{font-family:monospace;font-size:17px}.small{font-size:14px;fill:#536778}</style>
<text x="28" y="33" class="label" xml:space="preserve" >1  Java input · two records</text>
<rect x="20" y="47" width="600" height="106" rx="10" fill="white" stroke="#c7d6df"/>
<text x="36" y="82" class="mono" xml:space="preserve" >00042   Laptop   1250</text>
<text x="36" y="118" class="mono" xml:space="preserve" >00043   Mouse      80</text>
<text x="28" y="188" class="label" xml:space="preserve" >2  Import records + calculate the total</text>
<rect x="20" y="202" width="600" height="106" rx="10" fill="white" stroke="#c7d6df"/>
<text x="36" y="237" class="mono" xml:space="preserve" >sheet.importData(..., orders, options)</text>
<text x="36" y="273" class="mono" xml:space="preserve" >C4 = SUM(C2:C3)</text>
<text x="28" y="347" class="label" xml:space="preserve" >3  Saved Excel output · Sales!A1:C4</text>
<rect x="20" y="361" width="600" height="151" rx="10" fill="white" stroke="#c7d6df"/>
<rect x="30" y="369" width="580" height="32" rx="4" fill="#e7eff5"/>
<text x="36" y="390" class="label" xml:space="preserve" >Order ID</text>
<text x="225" y="390" class="label" xml:space="preserve" >Product</text>
<text x="425" y="390" class="label" xml:space="preserve" >Amount</text>
<line x1="30" x2="610" y1="401" y2="401" stroke="#e1e9ee"/>
<text x="36" y="422" class="mono" xml:space="preserve" >00042</text>
<text x="225" y="422" class="mono" xml:space="preserve" >Laptop</text>
<text x="425" y="422" class="mono" xml:space="preserve" >1,250.00</text>
<line x1="30" x2="610" y1="433" y2="433" stroke="#e1e9ee"/>
<text x="36" y="454" class="mono" xml:space="preserve" >00043</text>
<text x="225" y="454" class="mono" xml:space="preserve" >Mouse</text>
<text x="425" y="454" class="mono" xml:space="preserve" >80.00</text>
<line x1="30" x2="610" y1="465" y2="465" stroke="#e1e9ee"/>
<text x="36" y="486" class="mono" xml:space="preserve" >Total</text>
<text x="225" y="486" class="mono" xml:space="preserve" ></text>
<text x="425" y="486" class="mono" xml:space="preserve" >1,330.00</text>
<text x="28" y="553" class="small" xml:space="preserve" >Reopened: text IDs, numeric amounts, formula and formats checked.</text>
<text x="28" y="579" class="small" xml:space="preserve" >Workbook data preview; not an Excel UI screenshot.</text>
<text x="28" y="604" class="small" xml:space="preserve" >Evaluation copy. Downloaded workbooks retain their notices.</text>
</svg>